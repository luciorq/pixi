[package]
name = "pixi-build-zig"
version = "0.1.0"
edition.workspace = true
description = "A Zig build backend for Pixi"
documentation = "https://pixi.prefix.dev/latest/build/backends/pixi-build-zig/"
repository.workspace = true
license.workspace = true

[package.metadata.dist]
dist = false

[dependencies]
async-trait = { workspace = true }
indexmap = { workspace = true }
miette = { workspace = true }
minijinja = { workspace = true, features = ["json"] }
pixi_build_backend = { workspace = true }
pixi_build_types = { workspace = true }
rattler_build_recipe = { workspace = true }
rattler_conda_types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros"] }

[dev-dependencies]
insta = { workspace = true, features = ["filters", "redactions", "yaml"] }
serde_json = { workspace = true }

[features]
default = ["rustls"]
native-tls = ["pixi_build_backend/native-tls"]
rustls = ["pixi_build_backend/rustls"]
